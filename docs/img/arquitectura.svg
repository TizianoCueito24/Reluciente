<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial, sans-serif" font-size="14">
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="270" y="20" width="220" height="70" rx="8" fill="#e8f1fb" stroke="#2b6cb0"/>
  <text x="380" y="48" text-anchor="middle" font-weight="bold">Aplicación (mongosh)</text>
  <text x="380" y="70" text-anchor="middle" font-size="12">usuario reluciente_app (readWrite)</text>
  <text x="380" y="122" text-anchor="middle" font-size="12">replicaSet=relucienteRS · authSource=reluciente_db</text>
  <line x1="330" y1="90" x2="130" y2="190" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="380" y1="90" x2="380" y2="190" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="430" y1="90" x2="630" y2="190" stroke="#999" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="30" y="190" width="200" height="90" rx="8" fill="#e6f6ea" stroke="#2f855a"/>
  <text x="130" y="218" text-anchor="middle" font-weight="bold">Nodo 1 · PRIMARIO</text>
  <text x="130" y="240" text-anchor="middle" font-size="12">localhost:27017 · prioridad 2</text>
  <text x="130" y="260" text-anchor="middle" font-size="12">lecturas y escrituras · tiene datos</text>
  <rect x="280" y="190" width="200" height="90" rx="8" fill="#fff8e1" stroke="#b7791f"/>
  <text x="380" y="218" text-anchor="middle" font-weight="bold">Nodo 2 · SECUNDARIO</text>
  <text x="380" y="240" text-anchor="middle" font-size="12">localhost:27018 · prioridad 1</text>
  <text x="380" y="260" text-anchor="middle" font-size="12">replica y es candidato a primario</text>
  <rect x="530" y="190" width="200" height="90" rx="8" fill="#f3f3f3" stroke="#777"/>
  <text x="630" y="218" text-anchor="middle" font-weight="bold">Nodo 3 · ÁRBITRO</text>
  <text x="630" y="240" text-anchor="middle" font-size="12">localhost:27019 · sin datos</text>
  <text x="630" y="260" text-anchor="middle" font-size="12">solo vota en las elecciones</text>
  <line x1="230" y1="235" x2="280" y2="235" stroke="#2f855a" stroke-width="2"/>
  <text x="255" y="228" text-anchor="middle" font-size="11">oplog</text>
  <line x1="480" y1="235" x2="530" y2="235" stroke="#777" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="505" y="228" text-anchor="middle" font-size="11">voto</text>
  <text x="380" y="322" text-anchor="middle" font-size="12">Los tres nodos se autentican entre sí con el keyFile compartido (security.keyFile).</text>
  <text x="380" y="342" text-anchor="middle" font-size="12">Si cae el primario, el secundario + el árbitro suman 2 de 3 votos y eligen al nuevo primario.</text>
</svg>
