# Nodo arbitro del replica set "relucienteRS" (puerto 27019).
# Se lanza desde la RAÍZ del repositorio para que las rutas relativas funcionen.
# Este archivo NO contiene contraseñas; el keyFile se genera aparte y está en .gitignore.
storage:
  dbPath: data/arbitro
net:
  bindIp: 127.0.0.1
  port: 27019
replication:
  replSetName: relucienteRS
security:
  authorization: enabled
  keyFile: keys/mongo.key
systemLog:
  destination: file
  path: logs/arbitro.log
  logAppend: true
